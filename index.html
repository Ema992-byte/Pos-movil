<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Móvil - La Nueva</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- INDICADOR DE ESTADO DE RED -->
  <div id="estadoRed" class="w-full max-w-5xl mb-2 text-center text-xs font-bold py-1 rounded hidden">
    <!-- Se muestra dinámicamente si hay o no internet -->
  </div>

  <!-- PANTALLA DE INICIO DE SESIÓN -->
  <div id="loginSection" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">La Nueva 🛒</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="admi@pos.com"
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors">
        Ingresar al POS
      </button>
    </form>
  </div>

  <!-- PANTALLA PRINCIPAL DEL POS -->
  <div id="posSection" class="hidden bg-white p-6 rounded-2xl shadow-lg w-full max-w-5xl">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-800">Punto de Venta 📱</h1>
      <div class="flex gap-2">
        <button onclick="descargarReporteCSV()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-sm font-medium">
          📊 Descargar Reporte
        </button>
        <button onclick="cerrarSesion()" class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-2 rounded-lg text-sm font-medium">
          Cerrar Sesión
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Sección de Productos y Buscador -->
      <div class="flex flex-col h-[520px]">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-lg font-semibold text-slate-700">Catálogo de Productos</h3>
          <span id="cantProductos" class="text-xs text-slate-500 font-medium"></span>
        </div>
        
        <!-- Buscador en tiempo real -->
        <div class="mb-3">
          <input type="text" id="buscador" placeholder="🔍 Buscar por nombre o código..." oninput="filtrarProductosDebounced()"
            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
        </div>

        <div id="productosList" class="space-y-2 overflow-y-auto pr-2 flex-grow border border-slate-100 rounded-lg p-2">
          <p class="text-slate-400 text-sm text-center py-4">Cargando catálogo...</p>
        </div>
      </div>

      <!-- Carrito / Venta Actual -->
      <div class="bg-slate-50 p-4 rounded-xl flex flex-col justify-between border border-slate-200 h-[520px]">
        <div>
          <h3 class="text-lg font-semibold text-slate-700 mb-3">Venta Actual</h3>
          <div id="carritoList" class="space-y-2 overflow-y-auto max-h-[320px] pr-1 mb-4">
            <p class="text-slate-400 text-sm text-center py-4">El carrito está vacío</p>
          </div>
        </div>
        
        <div class="border-t pt-4">
          <div class="flex justify-between text-xl font-bold text-slate-800 mb-4">
            <span>Total:</span>
            <span id="totalVenta">$0.00</span>
          </div>
          <button onclick="cobrarVenta()"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition-colors">
            Cobrar, Imprimir y Registrar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- SECCIÓN OCULTA PARA IMPRESIÓN DE TICKET -->
  <div id="ticketImpresion" class="hidden p-6 font-mono text-sm max-w-xs mx-auto bg-white">
    <div class="text-center font-bold text-lg mb-1">LA NUEVA 🛒</div>
    <div class="text-center text-xs mb-3">Punto de Venta Móvil</div>
    <div class="text-xs mb-2" id="ticketFecha">Fecha: --/--/---- --:--</div>
    <div class="border-t border-dashed border-black my-2"></div>
    <div id="ticketItems" class="space-y-1 text-xs"></div>
    <div class="border-t border-dashed border-black my-2"></div>
    <div class="flex justify-between font-bold text-base">
      <span>TOTAL:</span>
      <span id="ticketTotal">$0.00</span>
    </div>
    <div class="text-center text-xs mt-4">¡Gracias por su compra!</div>
  </div>

  <!-- SCRIPT DE LÓGICA Y MODO OFFLINE -->
  <script>
    const SUPABASE_URL = 'https://xjvhzfdgdivumluuegmm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lPJ95RgDRb5Vi4lLGrFULg_HI8_57RP';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let todosLosProductos = [];
    let carrito = [];
    let timerBusqueda = null;

    // Control de Estado de Conexión en vivo
    window.addEventListener('online', actualizarEstadoRed);
    window.addEventListener('offline', actualizarEstadoRed);

    function actualizarEstadoRed() {
      const banner = document.getElementById('estadoRed');
      if (navigator.onLine) {
        banner.className = 'w-full max-w-5xl mb-2 text-center text-xs font-bold py-1 rounded bg-emerald-100 text-emerald-800';
        banner.textContent = '🟢 Conectado a Internet (Sincronizado)';
        banner.classList.remove('hidden');
        sincronizarVentasPendientes();
      } else {
        banner.className = 'w-full max-w-5xl mb-2 text-center text-xs font-bold py-1 rounded bg-amber-100 text-amber-800';
        banner.textContent = '⚡ Modo Offline Activo (Operando sin internet)';
        banner.classList.remove('hidden');
      }
    }

    // Inicializar estado de red al cargar
    setTimeout(actualizarEstadoRed, 500);

    // Manejo del Login (permite offline si ya guardó sesión o usa caché)
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!navigator.onLine) {
        // Modo offline directo si hay datos locales
        const cachedProductos = localStorage.getItem('la_nueva_productos');
        if (cachedProductos) {
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('posSection').classList.remove('hidden');
          todosLosProductos = JSON.parse(cachedProductos);
          document.getElementById('cantProductos').textContent = `${todosLosProductos.length} productos (Offline)`;
          mostrarProductos(todosLosProductos.slice(0, 40));
          alert('Ingresando en modo offline con el catálogo guardado.');
          return;
        } else {
          alert('No hay internet y no se encontró catálogo guardado en este dispositivo.');
          return;
        }
      }

      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Error al ingresar: ' + error.message);
      } else {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('posSection').classList.remove('hidden');
        cargarProductos();
      }
    });

    // Cargar catálogo (desde Supabase si hay red, o desde LocalStorage si está offline)
    async function cargarProductos() {
      const contenedor = document.getElementById('productosList');
      
      if (!navigator.onLine) {
        cargarProductosOffline();
        return;
      }

      contenedor.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">Actualizando catálogo desde Supabase...</p>';

      const { data, error } = await _supabase.from('productos').select('*').range(0, 1999);

      if (error) {
        console.warn('Error de red, cargando desde caché local...');
        cargarProductosOffline();
        return;
      }

      todosLosProductos = data;
      // Guardar copia en el navegador para uso offline
      localStorage.setItem('la_nueva_productos', JSON.stringify(data));

      document.getElementById('cantProductos').textContent = `${data.length} productos`;
      mostrarProductos(todosLosProductos.slice(0, 40));
    }

    function cargarProductosOffline() {
      const cached = localStorage.getItem('la_nueva_productos');
      const contenedor = document.getElementById('productosList');

      if (cached) {
        todosLosProductos = JSON.parse(cached);
        document.getElementById('cantProductos').textContent = `${todosLosProductos.length} productos (Offline)`;
        mostrarProductos(todosLosProductos.slice(0, 40));
      } else {
        contenedor.innerHTML = '<p class="text-red-500 text-sm text-center">Sin internet y sin catálogo guardado previamente.</p>';
      }
    }

    function mostrarProductos(productos) {
      const contenedor = document.getElementById('productosList');

      if (!productos || productos.length === 0) {
        contenedor.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">No se encontraron productos.</p>';
        return;
      }

      const tempDiv = document.createElement('div');
      let htmlContent = '';
      productos.forEach((prod, idx) => {
        const idUnico = prod.id || prod.codigo || idx;
        const nombreEscapado = (prod.nombre || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        
        htmlContent += `
          <div class="flex justify-between items-center bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm text-sm">
            <div class="pr-2 flex-grow">
              <p class="font-semibold text-slate-800">${prod.nombre}</p>
              <p class="text-xs text-slate-500">Stock: ${prod.stock} | <strong>$${prod.precio}</strong></p>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <input type="number" id="qty_input_${idUnico}" value="1" min="1" 
                class="w-14 px-2 py-1 text-center border rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <button onclick="agregarAlCarrito('${idUnico}', '${nombreEscapado}', ${prod.precio})"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-md text-xs font-medium">
                Agregar
              </button>
            </div>
          </div>
        `;
      });

      tempDiv.innerHTML = htmlContent;
      contenedor.innerHTML = '';
      contenedor.appendChild(tempDiv);
    }

    function filtrarProductosDebounced() {
      clearTimeout(timerBusqueda);
      timerBusqueda = setTimeout(filtrarProductos, 120);
    }

    function filtrarProductos() {
      const texto = document.getElementById('buscador').value.trim().toLowerCase();
      
      if (!texto) {
        mostrarProductos(todosLosProductos.slice(0, 40));
        return;
      }

      const filtrados = todosLosProductos.filter(p => 
        (p.nombre && p.nombre.toLowerCase().includes(texto)) || 
        (p.codigo && String(p.codigo).includes(texto))
      ).slice(0, 40);

      mostrarProductos(filtrados);
    }

    function agregarAlCarrito(idUnico, nombre, precio) {
      const inputQty = document.getElementById(`qty_input_${idUnico}`);
      const cantidadAAgregar = parseInt(inputQty ? inputQty.value : 1) || 1;

      const itemExistente = carrito.find(item => item.idUnico === idUnico);
      
      if (itemExistente) {
        itemExistente.cantidad += cantidadAAgregar;
      } else {
        carrito.push({ idUnico, nombre, precio, cantidad: cantidadAAgregar });
      }

      if (inputQty) inputQty.value = 1;
      actualizarCarritoVisual();
    }

    function actualizarCarritoVisual() {
      const contenedor = document.getElementById('carritoList');
      const totalSpan = document.getElementById('totalVenta');

      if (carrito.length === 0) {
        contenedor.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">El carrito está vacío</p>';
        totalSpan.textContent = '$0.00';
        return;
      }

      contenedor.innerHTML = '';
      let total = 0;

      carrito.forEach((item, index) => {
        let subtotal = item.precio * item.cantidad;
        total += subtotal;
        contenedor.innerHTML += `
          <div class="flex justify-between items-center bg-white p-2.5 rounded border text-sm shadow-sm gap-2">
            <div class="flex-grow">
              <p class="font-medium text-slate-800">${item.nombre}</p>
              <p class="text-xs text-slate-500">$${item.precio} c/u</p>
            </div>
            
            <div class="flex items-center gap-1">
              <span class="text-xs text-slate-400">Cant:</span>
              <input type="number" min="1" value="${item.cantidad}" 
                onchange="modificarCantidadDirecta(${index}, this.value)"
                class="w-16 px-2 py-1 text-center font-semibold border border-slate-300 rounded text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="text-right min-w-[65px]">
              <span class="font-semibold text-slate-700 text-xs">$${subtotal.toFixed(2)}</span>
            </div>

            <button onclick="removerDelCarrito(${index})" class="text-rose-500 hover:text-rose-700 font-bold px-1 ml-1">✕</button>
          </div>
        `;
      });

      totalSpan.textContent = '$' + total.toFixed(2);
    }

    function modificarCantidadDirecta(index, nuevaCantidad) {
      const cant = parseInt(nuevaCantidad);
      if (isNaN(cant) || cant <= 0) {
        removerDelCarrito(index);
      } else {
        carrito[index].cantidad = cant;
        actualizarCarritoVisual();
      }
    }

    function removerDelCarrito(index) {
      carrito.splice(index, 1);
      actualizarCarritoVisual();
    }

    // Cobrar venta (funciona online y offline guardando en cola si no hay red)
    async function cobrarVenta() {
      if (carrito.length === 0) {
        alert('El carrito está vacío');
        return;
      }

      let total = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
      const ventaLocal = {
        total: total,
        detalles: [...carrito],
        creado_en: new Date().toISOString()
      };

      if (navigator.onLine) {
        try {
          const { data: ventaData, error: ventaError } = await _supabase
            .from('ventas')
            .insert([{ total: total }])
            .select();

          if (ventaError) throw ventaError;

          const ventaId = ventaData[0].id;
          const detallesInserts = carrito.map(item => ({
            venta_id: ventaId,
            nombre_producto: item.nombre,
            cantidad: item.cantidad,
            precio_unitario: item.precio,
            subtotal: item.precio * item.cantidad
          }));

          await _supabase.from('detalle_ventas').insert(detallesInserts);
          alert('¡Venta registrada en la nube con éxito!');
        } catch (err) {
          console.warn('Error al subir a Supabase, guardando localmente...', err);
          guardarVentaOffline(ventaLocal);
        }
      } else {
        guardarVentaOffline(ventaLocal);
        alert('⚡ Sin conexión: Venta guardada localmente. Se sincronizará al volver el internet.');
      }

      // Imprimir ticket siempre
      generarEImprimirTicket(total);

      carrito = [];
      actualizarCarritoVisual();
    }

    function guardarVentaOffline(venta) {
      let pendientes = JSON.parse(localStorage.getItem('ventas_pendientes') || '[]');
      pendientes.push(venta);
      localStorage.setItem('ventas_pendientes', JSON.stringify(pendientes));
    }

    async function sincronizarVentasPendientes() {
      let pendientes = JSON.parse(localStorage.getItem('ventas_pendientes') || '[]');
      if (pendientes.length === 0) return;

      console.log('Sincronizando ventas pendientes...', pendientes.length);
      for (let i = 0; i < pendientes.length; i++) {
        let v = pendientes[i];
        try {
          const { data: vData, error: vErr } = await _supabase
            .from('ventas')
            .insert([{ total: v.total, creado_en: v.creado_en }])
            .select();

          if (!vErr && vData) {
            let vId = vData[0].id;
            let det = v.detalles.map(d => ({
              venta_id: vId,
              nombre_producto: d.nombre,
              cantidad: d.cantidad,
              precio_unitario: d.precio,
              subtotal: d.precio * d.cantidad
            }));
            await _supabase.from('detalle_ventas').insert(det);
          }
        } catch (e) {
          console.error('Error sincronizando venta pendiente', e);
          return;
        }
      }
      // Limpiar cola si se subieron todas con éxito
      localStorage.removeItem('ventas_pendientes');
      console.log('¡Sincronización completa!');
    }

    function generarEImprimirTicket(total) {
      const fechaActual = new Date().toLocaleString();
      document.getElementById('ticketFecha').textContent = `Fecha: ${fechaActual}`;
      
      const ticketItemsContainer = document.getElementById('ticketItems');
      ticketItemsContainer.innerHTML = '';

      carrito.forEach(item => {
        let sub = item.precio * item.cantidad;
        ticketItemsContainer.innerHTML += `
          <div class="flex justify-between">
            <span>${item.cantidad}x ${item.nombre}</span>
            <span>$${sub.toFixed(2)}</span>
          </div>
        `;
      });

      document.getElementById('ticketTotal').textContent = '$' + total.toFixed(2);

      const contenidoTicket = document.getElementById('ticketImpresion').innerHTML;
      const ventanaImpresion = window.open('', '_blank', 'width=350,height=600');
      ventanaImpresion.document.write(`
        <html>
          <head>
            <title>Ticket de Venta</title>
            <script src="https://cdn.tailwindcss.com"><\/script>
          </head>
          <body class="bg-white p-4">
            ${contenidoTicket}
            <script>
              window.onload = function() {
                window.print();
                setTimeout(() => window.close(), 500);
              }
            <\/script>
          </body>
        </html>
      `);
      ventanaImpresion.document.close();
    }

    async function descargarReporteCSV() {
      let ventasLocal = JSON.parse(localStorage.getItem('ventas_pendientes') || '[]');
      
      if (!navigator.onLine) {
        // Descargar reporte local si no hay internet
        let csvContent = "data:text/csv;charset=utf-8,Total,Fecha (Pendiente Sync)\n";
        ventasLocal.forEach(v => { csvContent += `${v.total},${v.creado_en}\n`; });
        descargarCSVFile(csvContent, "reporte_ventas_offline.csv");
        return;
      }

      const { data, error } = await _supabase.from('ventas').select('*').order('id', { ascending: false });
      if (error) {
        alert('Error al obtener reporte: ' + error.message);
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,ID Venta,Total,Fecha y Hora\n";
      data.forEach(v => { csvContent += `${v.id},${v.total},${v.creado_en || ''}\n`; });
      descargarCSVFile(csvContent, "reporte_ventas_la_nueva.csv");
    }

    function descargarCSVFile(content, filename) {
      const encodedUri = encodeURI(content);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function cerrarSesion() {
      _supabase.auth.signOut();
      document.getElementById('posSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }
  </script>
</body>
</html>
