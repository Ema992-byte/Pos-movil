<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Móvil</title>
  <!-- Tailwind CSS para los estilos gráficos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería cliente de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <!-- PANTALLA DE INICIO DE SESIÓN -->
  <div id="loginSection" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Iniciar Sesión</h2>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="admi@pos.com"
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors">
        Ingresar
      </button>
    </form>
  </div>

  <!-- PANTALLA PRINCIPAL DEL POS (Oculta por defecto) -->
  <div id="posSection" class="hidden bg-white p-8 rounded-2xl shadow-lg w-full max-w-4xl text-center">
    <h1 class="text-3xl font-bold text-slate-800 mb-4">Punto de Venta (POS)</h1>
    <p class="text-emerald-600 font-semibold mb-6">¡Sesión iniciada con éxito!</p>
    <button onclick="cerrarSesion()" class="bg-rose-500 hover:bg-rose-600 text-white px-6 py-2 rounded-lg">
      Cerrar Sesión
    </button>
  </div>

  <!-- CÓDIGO JAVASCRIPT Y CONEXIÓN A SUPABASE -->
  <script>
    // Configuración de Supabase con tus credenciales reales
    const SUPABASE_URL = 'https://xjvhzfdgdivumluuegmm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lPJ95RgDRb5Vi4lLGrFULg_HI8_57RP';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Evento de inicio de sesión
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert('Error al ingresar: ' + error.message);
      } else {
        alert('¡Bienvenido! Inicio de sesión exitoso.');
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('posSection').classList.remove('hidden');
      }
    });

    function cerrarSesion() {
      _supabase.auth.signOut();
      document.getElementById('posSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }
  </script>
</body>
</html>
